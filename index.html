<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PepeLand Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="widget-wrapper" id="widget">
    <div class="widget-icon">
        <!-- ИЗМЕНЕНИЕ ЗДЕСЬ: указываем файл pepe.svg -->
        <img src="pepe.svg" alt="Pepe">
    </div>
    <div class="widget-content">
        <div class="title-row" id="title-row">
            <span class="brand-name">PepeLand</span>
            <span class="brand-number" id="counter">0</span>
        </div>
        <div class="link-row" id="link-text">pepeLand.net</div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
